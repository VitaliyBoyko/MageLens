name: Publish release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish notes from the annotated version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          gh repo clone "$GH_REPO" release -- --depth 1 --branch "$RELEASE_REF"
          cd release
          RELEASE_TAG="v$(jq -r .version package.json)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            [[ "$RELEASE_REF" == "$RELEASE_TAG" ]]
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          # A version commit can arrive before its tag; the tag push will publish it.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then exit 0; fi
          git fetch --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag \
            --title "MageLens $RELEASE_TAG" --latest
