pcov.enabled=1
pcov.large_codebase=1
pcov.request_magento_cache=1
; The startup filter covers local source; each export selects the active scope.
pcov.directory=/var/www/html/app
pcov.exclude="~^/var/www/html/app/(?!(?:code|design/(?:frontend|adminhtml))/)~"
; Run isolation and disposable source changes must not share an opcode generation.
opcache.enable=0
