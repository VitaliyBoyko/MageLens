# MageLens installation inputs. Edit this file, then run ./install.sh.
# Use a flat mapping of quoted strings; comments and blank lines are supported.
# Release versions select matching Git tags (PCOV uses a v-prefixed tag).
MAGENTO_VERSION: "2.4.8-p5"
# Selects Mark Shust's PHP, nginx, database, cache, and search images together.
MARKSHUST_DOCKER_MAGENTO_VERSION: "53.1.0"
PCOV_VERSION: "2.1.2"
PIE_VERSION: "1.4.10"
CYPRESS_VERSION: "16.1.0"
TEMPLATE_COVERAGE_VERSION: "1.1.1"

# Node and browser system dependencies for the Cypress runner.
RUNNER_IMAGE: "cypress/base:24.15.0"
